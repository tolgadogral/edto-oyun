
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tolga & Eda Online</title>

<style>
* {
    box-sizing: border-box;
}

body {
    background: #0b1021;
    color: white;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0;
}

#login-screen {
    text-align: center;
    background: #12182b;
    padding: 40px;
    border-radius: 16px;
}

.role-btn {
    padding: 14px 24px;
    margin: 10px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: white;
}

.btn-p1 {
    background: #00aacc;
}

.btn-p2 {
    background: #e8437d;
}

#gameCanvas {
    border: 2px solid #1f293d;
    border-radius: 8px;
    background: #111827;
    display: none;
    max-width: 95vw;
    max-height: 75vh;
}

#status {
    font-size: 13px;
    color: #94a3b8;
    margin-top: 12px;
}
</style>
</head>

<body>

<div id="login-screen">
    <h1>🌙 Tolga & Eda</h1>
    <p>Hangi karakterle bağlanıyorsun?</p>

    <button class="role-btn btn-p1" id="b1">
        Tolga ❤️
    </button>

    <button class="role-btn btn-p2" id="b2">
        Eda ❤️
    </button>
</div>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<div id="status"></div>

<script>

const colors = {
    p1: '#00d2ff',
    p2: '#ff5e95'
};

const players = {
    p1: { x: 200, y: 300 },
    p2: { x: 600, y: 300 }
};

let myRole = null;
let keys = {};
let animationStarted = false;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function setStatus(message) {
    document.getElementById('status').textContent = message;
}

// KARAKTER SEÇİMİ

document.getElementById('b1').addEventListener('click', () => {
    selectRole('p1');
});

document.getElementById('b2').addEventListener('click', () => {
    selectRole('p2');
});

function selectRole(role) {

    myRole = role;

    document.getElementById('login-screen').style.display = 'none';
    canvas.style.display = 'block';

    setStatus(
        role === 'p1'
        ? 'Tolga olarak oynuyorsun! ❤️'
        : 'Eda olarak oynuyorsun! ❤️'
    );

    if (!animationStarted) {
        animationStarted = true;
        requestAnimationFrame(loop);
    }
}

// KLAVYE KONTROLLERİ

window.addEventListener('keydown', (e) => {

    keys[e.key.toLowerCase()] = true;

    if (
        ['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' ']
        .includes(e.key.toLowerCase())
    ) {
        e.preventDefault();
    }

});

window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
});

// OYUN DÖNGÜSÜ

function loop() {

    if (myRole) {

        const me = players[myRole];
        const speed = 4;

        if (keys['w'] || keys['arrowup']) me.y -= speed;
        if (keys['s'] || keys['arrowdown']) me.y += speed;
        if (keys['a'] || keys['arrowleft']) me.x -= speed;
        if (keys['d'] || keys['arrowright']) me.x += speed;

        me.x = Math.max(20, Math.min(780, me.x));
        me.y = Math.max(20, Math.min(580, me.y));

    }

    // ARKA PLAN

    ctx.clearRect(0, 0, 800, 600);

    // ZEMİN DESENİ

    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 1;

    for (let x = 0; x < 800; x += 50) {
        for (let y = 0; y < 600; y += 50) {
            ctx.strokeRect(x, y, 50, 50);
        }
    }

    // KARAKTERLER

    ['p1', 'p2'].forEach((role) => {

        const player = players[role];

        ctx.fillStyle = colors[role];

        ctx.beginPath();
        ctx.arc(player.x, player.y, 18, 0, Math.PI * 2);
        ctx.fill();

        // İSİMLER

        ctx.fillStyle = 'white';
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'center';

        ctx.fillText(
            role === 'p1' ? 'Tolga ❤️' : 'Eda ❤️',
            player.x,
            player.y - 28
        );

    });

    requestAnimationFrame(loop);
}

</script>

</body>
</html>
