<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edto Online</title>
    <style>
        body {
            background: #0b1021;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            box-sizing: border-box;
        }
        #game-container {
            position: relative;
        }
        #login-screen {
            text-align: center;
            background: rgba(18, 24, 43, 0.9);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .role-btn {
            padding: 12px 24px;
            margin: 10px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #fff;
        }
        .btn-p1 { background: #00d2ff; }
        .btn-p2 { background: #ff5e95; }
        #gameCanvas {
            border: 2px solid #1f293d;
            border-radius: 8px;
            background: #111827;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Karakter Seçim Ekranı -->
        <div id="login-screen">
            <h1>🌙 Edto Online</h1>
            <p style="color:#94a3b8; font-size:14px;">Hangi karakterle bağlanıyorsun?</p>
            <div class="role-btn">
                <button class="role-btn btn-p1" onclick="selectRole('p1')">Haru (Ben)</button>
                <button class="role-btn btn-p2" onclick="selectRole('p2')">❤️ Sevgilin</button>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="600" style="display:none;"></canvas>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Global fonksiyon (Butonun çalışması için şart)
        window.selectRole = function(role) {
            console.log("Rol seçildi:", role);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('gameCanvas').style.display = 'block';
            
            // Oyun motoru başlatma kodları buraya gelebilir
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#00d2ff';
            ctx.font = '24px Arial';
            ctx.fillText("Oyun Başladı! Karakter: " + role, 50, 100);
        };

        // Firebase Ayarları
        const firebaseConfig = {
            apiKey: "AIzaSyAHPOFEyQyQ4Pv01qk41mevKBCrrl_oHg",
            authDomain: "edto-570e7.firebaseapp.com",
            databaseURL: "https://edto-570e7-default-rtdb.firebaseio.com",
            projectId: "edto-570e7",
            storageBucket: "edto-570e7.appspot.com",
            messagingSenderId: "335796327341",
            appId: "1:335796327341:web:837ce32ae93c2bf9f50724"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
    </script>
</body>
</html>
